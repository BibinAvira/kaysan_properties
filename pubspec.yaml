name: kaysan_properties
description: "Kaysan Properties — native Flutter app for Dubai off-plan real estate."
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Navigation
  go_router: ^14.2.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.1
  photo_view: ^0.15.0
  smooth_page_indicator: ^1.1.0

  # Maps & launching
  #google_maps_flutter: ^2.6.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0

  # Storage
  shared_preferences: ^2.2.3

  # Utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  lucide_icons_flutter: ^3.1.15
  glass_kit: ^4.0.2
  flutter_secure_storage: ^10.3.1
  country_code_picker: ^3.4.1
  geolocator: ^12.0.0
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21

  # Android Adaptive Icon
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  adaptive_icon_background: "#FFFFFF"

